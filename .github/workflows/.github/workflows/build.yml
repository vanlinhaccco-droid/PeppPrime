name: Build PEPPA AIM

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project "PEPPA AIM.xcodeproj" \
            -scheme "PEPPA AIM" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/PEPPA AIM.app" Payload/
          zip -r PEPPA-AIM-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: PEPPA-AIM-IPA
          path: PEPPA-AIM-unsigned.ipa
